<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ accion }} mascota</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        label { display: block; margin-top: 12px; }
        input { padding: 6px; width: 250px; }
        .msg-error { color: #b00020; }
        .btn { padding: 6px 14px; margin-top: 16px; }
    </style>
</head>
<body>

    <h2>{{ accion }} mascota</h2>

    {% if error %}
        <p class="msg-error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="nombre">Nombre de la mascota</label>
        <input type="text" id="nombre" name="nombre"
               value="{% if registro %}{{ registro.nombre }}{% endif %}" required>

        <label for="peso">Peso (kilos)</label>
        <input type="number" id="peso" name="peso"
               value="{% if registro %}{{ registro.peso }}{% endif %}" required>

        <br>
        <button class="btn" type="submit">Guardar</button>
        <a href="{% url 'lista' %}">Cancelar</a>
    </form>

</body>
</html>
