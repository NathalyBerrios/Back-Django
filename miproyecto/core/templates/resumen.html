<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resumen Veterinaria</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Registro de Admisiones Veterinarias</h2>

    <table>
        <tr>
            <th>Nombre de la Mascota</th>
            <th>Estado</th>
        </tr>
        
        <!-- Aquí Django inserta los datos de tu JSON -->
        {% for registro in registros %}
        <tr>
            <td>{{ registro.nombre }}</td>
            <td>{{ registro.estado }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No hay mascotas registradas todavía.</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
